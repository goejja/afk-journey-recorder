name: Bug
description: Something that is broken or gives a wrong result.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, with the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps or the command, and which mode, map or record it needs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit hash you ran (`git rev-parse --short HEAD`), or "main" if it is the latest.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Record IDs, file paths, query output. Do not paste your database, and do not post pictures or text that show real player names or IDs.
